# Enable nice!view
CONFIG_ZMK_DISPLAY=y

# 1. Enable idle blanking (CRITICAL FOR BATTERY)
# This allows the screen to turn off after a period of inactivity.
# On a nice!nano, this is essential to hit those 'week-long' battery marks.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# 2. Use the efficient built-in status screen
# This removes the WPM graph and animations, using static icons instead.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILTIN=y

# 3. Optional: Disable custom widgets if you were using them
# This ensures ZMK doesn't try to calculate KPM/WPM in the background.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
